[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = "0.8.23"
evm_version = "shanghai"
#via_ir = false
#optimizer_runs = 10000

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    "@tokenized-strategy/=lib/tokenized-strategy/src/",
    "@periphery/=lib/tokenized-strategy-periphery/src/",
    "@slipstream=lib/slipstream/contracts/",
    "@createx-forge/=lib/createx-forge/",
]

no-match-path = 'src/test/aave/*' # skip aave tests while we work on moonwell

[fuzz]
runs = 1000
max_test_rejects = 10000000
no-match-test = "aprOracle"
